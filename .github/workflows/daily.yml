name: daily-videos
on:
  push:
    branches: [main]
    paths: ["trigger/**"]
  schedule:
    - cron: "47 0 * * *"        # 06:17 IST, just after the free Cloudflare allowance resets
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel key (blank = today's schedule)"
        required: false
      no_upload:
        description: "Test run without uploading (true/false)"
        required: false
        default: "false"
permissions:
  contents: write
concurrency: { group: daily-videos, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      YT_ALL: ${{ secrets.YT_ALL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_TOKEN_FORGOTTEN_EMPIRES: ${{ secrets.YT_TOKEN_FORGOTTEN_EMPIRES }}
      YT_TOKEN_CURIOSITY_SHORTS: ${{ secrets.YT_TOKEN_CURIOSITY_SHORTS }}
      YT_TOKEN_BUSINESS_FRONTIER: ${{ secrets.YT_TOKEN_BUSINESS_FRONTIER }}
      YT_TOKEN_BYTE_BRIEF: ${{ secrets.YT_TOKEN_BYTE_BRIEF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package.json') }}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig > /dev/null
          pip install -q json-repair requests pillow numpy soundfile google-api-python-client google-auth
          export ONNXRUNTIME_NODE_INSTALL_CUDA=skip
          for i in 1 2 3; do npm install --no-audit --no-fund --onnxruntime-node-install-cuda=skip && break; echo "npm retry $i"; sleep 20; done
          mkdir -p ~/.fonts
          find node_modules/@expo-google-fonts -name "*.ttf" | grep -E "Cinzel_900Black|Anton_400Regular|Montserrat_800ExtraBold.ttf|Montserrat_900Black.ttf" | xargs -I{} cp {} ~/.fonts/
          fc-cache -f > /dev/null
      - name: Make videos
        run: |
          CH="${{ github.event.inputs.channel }}"
          FLAG=""; [ "${{ github.event.inputs.no_upload }}" = "true" ] && FLAG="--no-upload"
          if [ -z "$CH" ]; then
            CH=$(python -c "import json,datetime;d=datetime.datetime.utcnow().weekday();print(' '.join(k for k,v in json.load(open('channels.json')).items() if d in v['days']))")
          fi
          FAIL=0
          for c in $CH; do
            echo "::group::$c"
            python engine/pipeline.py $c $FLAG || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL
      - name: Save history
        if: always()
        run: |
          git config user.name "padhan-video-engine"; git config user.email "actions@users.noreply.github.com"
          git add data/ && git commit -m "history: $(date -u +%F)" && git push || echo "nothing to commit"
      - name: Publish previews (low-res, for review)
        if: always()
        run: |
          set +e
          mkdir -p /tmp/prev
          for d in out/*/; do
            c=$(basename $d)
            [ -f $d/long.mp4 ] && ffmpeg -loglevel error -y -i $d/long.mp4 -vf scale=-2:480 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 64k /tmp/prev/$c-long.mp4
            [ -f $d/short.mp4 ] && ffmpeg -loglevel error -y -i $d/short.mp4 -vf scale=-2:640 -c:v libx264 -crf 30 -preset veryfast -c:a aac -b:a 64k /tmp/prev/$c-short.mp4
            [ -f $d/thumb.jpg ] && cp $d/thumb.jpg /tmp/prev/$c-thumb.jpg
            [ -f $d/script.json ] && cp $d/script.json /tmp/prev/$c-script.json
            ls $d/img/*.jpg >/dev/null 2>&1 && python -c "
          import glob,sys; from PIL import Image
          fs=sorted(glob.glob('$d/img/*.jpg')); ims=[Image.open(f).convert('RGB') for f in fs]
          w=320; ims=[i.resize((w,int(w*i.height/i.width))) for i in ims]; cols=6; rows=(len(ims)+cols-1)//cols; h=max(i.height for i in ims)
          c=Image.new('RGB',(cols*w,rows*h)); [c.paste(im,((k%cols)*w,(k//cols)*h)) for k,im in enumerate(ims)]; c.save('/tmp/prev/$c-images.jpg',quality=80)"
          done
          ls /tmp/prev | grep -q . || exit 0
          cd /tmp/prev && git init -q -b previews && git add -A && git -c user.name=padhan-video-engine -c user.email=actions@users.noreply.github.com commit -qm "previews $(date -u +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
      - name: Keep videos for review (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/thumb.jpg
            out/**/img/*.jpg
            out/**/script.json
            out/**/review_*.json
          retention-days: 7
          if-no-files-found: ignore
